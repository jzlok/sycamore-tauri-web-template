[package]
name = "dock"
description = "Tabbed panels in a tree of resizable, drag-and-drop splits (Sycamore)."
version = "0.1.0"
edition = "2021"

[dependencies]
panel = { path = "../panel" }
sycamore = "0.9"
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "PointerEvent",
]
